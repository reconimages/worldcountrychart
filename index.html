<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="World Country Chart — top country voices, worldwide. A daily chart of country singers from every corner of the globe." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0c09'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23c9a15c' font-family='Georgia'%3E%E2%99%AA%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("wcc-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>World Country Chart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
